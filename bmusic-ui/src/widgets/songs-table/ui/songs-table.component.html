<div class="song-header">
  <div class="header-item"><h4>Song</h4></div>
  <div class="header-item"><h4>Artist</h4></div>
  <div class="header-item"><h4>Album</h4></div>
  <div class="header-item"><h4>Time</h4></div>
  <div class="header-last"><h4>Actions</h4></div>
</div>
@for (song of songs; track song.id) {
  <div class="song-item" [class.currently-playing]="song.id === currentSongId()">
    <div class="song-column" (click)="play(song)">
      <app-song-tile [song]="song" />
    </div>
    <div class="artist-column"><p>{{ song.artist }}</p></div>
    <div class="album-column"><p>{{ song.album }}</p></div>
    <div class="time-column"><p>{{ song.length }}</p></div>
    <div class="actions-column">
      <app-song-menu
        [song]="song"
        [open]="openMenuSongId() === song.id"
        (openChange)="setMenuOpen(song.id, $event)"
        (playlistsChanged)="playlistsChanged.emit()"
      />
    </div>
  </div>
} @empty {
  <p class="empty">{{ emptyText }}</p>
}
