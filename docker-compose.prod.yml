# Production stack: built images, no source mounts, database not exposed.
services:
  database:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./database/V1___initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  bmusic-api:
    build:
      context: bmusic-api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
    depends_on:
      - database
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/data/uploads
      - covers_data:/app/data/covers

  bmusic-ui:
    build:
      context: bmusic-ui
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - bmusic-api
    ports:
      - "4200:80"

volumes:
  database_data:
  uploads_data:
  covers_data:
